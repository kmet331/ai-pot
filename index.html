function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 세트 선택: 직전 회차와 같은 세트 연속 방지 (36~40 지시문 세트에만 적용) ---------- */
let lastFillIdx = -1;
function pickSetIndex(count, last) {
  if (count <= 1) return 0;
  let i = Math.floor(Math.random() * count);
  if (i === last) i = (i + 1 + Math.floor(Math.random() * (count - 1))) % count;
  return i;
}

function buildSession() {
  // 1~30 스테이지: 문제 은행 랜덤(OX·객관식) / 31~35: 단답형 주관식(개별 풀에서 랜덤 5개) / 36~40: 지시문 주관식(세트 유지)
  const base = shuffle(QUESTION_BANK).slice(0, TOTAL - 10).map((q, i) => {
    if (q.type === "mc") {
      const choices = shuffle(q.choices);
      return { ...q, stage: i + 1, choices, correctIndex: choices.indexOf(q.answerText) };
    }
    return { ...q, stage: i + 1 };
  });
  // 단답형 세트들을 하나의 풀로 펼쳐 문항 단위로 랜덤 추출 (같은 세트일 필요 없음)
  const shortPool = SHORT_SETS.flatMap(set => set.items.map(it => ({ ...it, setName: set.name, mock: set.mock || false })));
  const shorts = shuffle(shortPool).slice(0, 5).map((it, k) => ({
    type: "short",
    stage: TOTAL - 10 + k + 1,
    q: it.q,
    context: it.context,
    answerDisplay: it.answerDisplay,
    accepted: it.accepted,
    explain: it.explain,
    setName: it.setName,
    mock: it.mock,
  }));
  const fi = pickSetIndex(FILL_SETS.length, lastFillIdx); lastFillIdx = fi;
  const fillSet = FILL_SETS[fi];
  const fills = fillSet.items.map((it, k) => ({
    type: "fill",
    stage: TOTAL - 5 + k + 1,
    q: `빈칸 ${it.blank} 에 들어갈 내용을 <보기>에서 골라 번호로 답하시오.`,
    blank: it.blank,
    setName: fillSet.name,
    setIntro: fillSet.intro,
    options: fillSet.options,
    context: fillSet.fullContext,
    answer: it.answer,
    explain: it.explain,
    mock: fillSet.mock || false,
  }));
  return [...base, ...shorts, ...fills];
}

/* ---------- 3D 배경 (스테이지 아일랜드 경로) ---------- */
function StageWorld({ stageIndex, resultsRef, version }) {
  const mountRef = useRef(null);
  const stageRef = useRef(stageIndex);
  stageRef.current = stageIndex;

  useEffect(() => {
    const mount = mountRef.current;
    if (!mount) return;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x070b1e, 0.016);

    const camera = new THREE.PerspectiveCamera(58, mount.clientWidth / mount.clientHeight, 0.1, 300);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight);
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x8899ff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(6, 12, 6);
    scene.add(dir);
    const glow = new THREE.PointLight(0xffa8cf, 1.5, 40);
    scene.add(glow);

    // 별
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(900 * 3);
    for (let i = 0; i < 900; i++) {
      starPos[i * 3] = (Math.random() - 0.5) * 220;
      starPos[i * 3 + 1] = Math.random() * 90 - 20;
      starPos[i * 3 + 2] = -Math.random() * 320 + 30;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x9fb4ff, size: 0.35, transparent: true, opacity: 0.8 })));

    // 스테이지 플랫폼 40개 (구불구불한 경로)
    const platformPos = [];
    const platforms = [];
    for (let i = 0; i < TOTAL; i++) {
      const p = new THREE.Vector3(Math.sin(i * 0.55) * 6.5, Math.sin(i * 1.25) * 1.4, -i * 7);
      platformPos.push(p);
      const geo = new THREE.CylinderGeometry(1.7, 2.1, 0.7, 6);
      const mat = new THREE.MeshStandardMaterial({ color: 0x1c2b57, emissive: 0x0a1330, roughness: 0.5, metalness: 0.35 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(p);
      scene.add(mesh);
      platforms.push(mesh);

      const ringGeo = new THREE.TorusGeometry(2.15, 0.06, 8, 32);
      const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x35e0ff, transparent: true, opacity: 0.35 }));
      ring.rotation.x = Math.PI / 2;
      ring.position.copy(p).add(new THREE.Vector3(0, 0.42, 0));
      scene.add(ring);
      mesh.userData.ring = ring;
    }

    // 경로 라인
    const curve = new THREE.CatmullRomCurve3(platformPos);
    const lineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(300));
    scene.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x2a68d9, transparent: true, opacity: 0.55 })));

    // 말랑 젤리 캐릭터 — 스테이지를 폴짝폴짝 밟고 지나가는 플레이어
    const JS = 1.5; // 캐릭터 크기 배율 (150%)
    const player = new THREE.Group();
    const jellyMat = new THREE.MeshStandardMaterial({ color: 0xff9ecb, emissive: 0x7c2a54, emissiveIntensity: 0.3, roughness: 0.35, metalness: 0.05 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.85, 28, 28), jellyMat);
    body.scale.y = 0.92;
    player.add(body);
    const eyeDark = new THREE.MeshBasicMaterial({ color: 0x22243a });

    /* 얼굴 부품은 '평면'이 아니라 몸통을 감싸는 '구면'에 붙인다.
       평면(z 고정)에 두면 볼록한 몸통 가운데가 앞으로 튀어나와 눈 꼭짓점이 파묻혀 잘려 보인다.
       FACE_R(0.872)은 몸통 반지름(0.85)보다 살짝 크므로 어떤 부품도 몸에 묻히지 않는다. */
    const FACE_R = 0.872;
    const _fv = new THREE.Vector3();
    const wrapFace = (geo) => {           // 평면 XY 도안을 구 표면으로 감싸기 (z = 표면에서 띄우는 두께)
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        _fv.set(p.getX(i), p.getY(i), FACE_R).normalize().multiplyScalar(FACE_R + p.getZ(i));
        p.setXYZ(i, _fv.x, _fv.y, _fv.z);
      }
      p.needsUpdate = true;
      geo.computeVertexNormals();
      return geo;
    };
    const faceDot = (x, y, r) => {        // 선 끝·꼭짓점을 둥글게 마감하는 원형 캡
      player.add(new THREE.Mesh(wrapFace(new THREE.CircleGeometry(r, 14).translate(x, y, 0.012)), eyeDark));
    };

    // '><' 찡긋 윙크 눈 — 막대 2개가 꼭짓점에서 정확히 만나고 양 끝은 둥글게 마감
    const BAR_LEN = 0.345, BAR_TH = 0.078, SPREAD = 0.49, EYE_X = 0.29, EYE_Y = 0.20;
    [[-EYE_X, Math.PI], [EYE_X, 0]].forEach(([x, baseAngle]) => { // 꼭짓점이 얼굴 중앙을 향하는 기준각
      faceDot(x, EYE_Y, BAR_TH / 2);      // 두 막대가 만나는 꼭짓점을 둥글게 이어 준다
      [baseAngle - SPREAD, baseAngle + SPREAD].forEach(angle => {
        const g = new THREE.BoxGeometry(BAR_LEN, BAR_TH, 0.024)
          .translate(BAR_LEN / 2, 0, 0.012)  // 회전 축(꼭짓점)을 막대 끝으로 이동
          .rotateZ(angle)
          .translate(x, EYE_Y, 0);
        player.add(new THREE.Mesh(wrapFace(g), eyeDark));
        faceDot(x + Math.cos(angle) * BAR_LEN, EYE_Y + Math.sin(angle) * BAR_LEN, BAR_TH / 2); // 바깥쪽 끝 둥글게
      });
    });

    /* 볼터치: 원판을 구 표면의 법선 방향으로 세우고 표면보다 바깥(0.885)에 띄운다.
       예전처럼 카메라 쪽만 보게 두면 안쪽 절반이 몸통에 파고들어 찌그러져 보였다. */
    const blushMat = new THREE.MeshBasicMaterial({ color: 0xff5f95, transparent: true, opacity: 0.85 });
    [-1, 1].forEach(s => {
      const dir = new THREE.Vector3(s * 0.56, -0.06, 0.66).normalize();
      const b = new THREE.Mesh(new THREE.CircleGeometry(0.115, 24), blushMat);
      b.position.copy(dir).multiplyScalar(0.885);
      // 법선에서 정면 쪽으로 살짝만 눕혀 화면에서 찌그러짐 없이 동그랗게 보이도록
      b.lookAt(b.position.clone().add(dir.clone().add(new THREE.Vector3(0, 0, 0.6)).normalize()));
      player.add(b);
    });

    // 입: 옆으로 넓고 완만한 두툼한 스마일 (큰 반지름 + 좁은 호 = 넓고 얕은 곡선), 양끝은 둥글게
    const MOUTH_R = 0.225, MOUTH_TUBE = 0.048, MOUTH_ARC = 1.45, MOUTH_Y = 0.078;
    const MOUTH_A0 = -Math.PI / 2 - MOUTH_ARC / 2; // 호의 중앙이 정확히 아래(6시)를 향하게
    const mouthGeo = new THREE.TorusGeometry(MOUTH_R, MOUTH_TUBE, 8, 32, MOUTH_ARC)
      .rotateZ(MOUTH_A0)
      .scale(1, 1, 0.25)                 // 튜브를 얼굴에 납작하게 눌러 붙인다
      .translate(0, MOUTH_Y, 0.012);
    player.add(new THREE.Mesh(wrapFace(mouthGeo), eyeDark));
    [MOUTH_A0, MOUTH_A0 + MOUTH_ARC].forEach(a => {
      faceDot(Math.cos(a) * MOUTH_R, MOUTH_Y + Math.sin(a) * MOUTH_R, MOUTH_TUBE); // 입꼬리 둥글게 마감
    });
    const footMat = new THREE.MeshStandardMaterial({ color: 0xe8486e, roughness: 0.5 });
    const feet = [-0.34, 0.34].map(x => {
      const f = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), footMat);
      f.position.set(x, -0.72, 0.12); f.scale.set(1.1, 0.6, 1.35); player.add(f); return f;
    });
    scene.add(player);
    // 캐릭터 점프 상태
    const jelly = { at: Math.min(stageRef.current, TOTAL - 1), hopping: false, from: 0, to: 0, t: 0, squash: 0 };

    const camTarget = new THREE.Vector3();
    let raf; let t = 0;
    let last = performance.now();

    const animate = () => {
      raf = requestAnimationFrame(animate);
      // 실제 경과 시간 기반(dt) — 주사율이 높은 모바일에서도 PC와 동일한 속도 보장
      const now = performance.now();
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      const f = dt * 60; // 60fps 기준 프레임 배수
      t += dt;
      const idx = Math.min(stageRef.current, TOTAL - 1);
      const base = platformPos[idx];

      // 젤리 캐릭터: 다음 스테이지로 폴짝 뛰어 밟고 지나가는 모션
      if (!jelly.hopping && jelly.at !== idx) {
        jelly.hopping = true; jelly.t = 0;
        jelly.from = jelly.at;
        jelly.to = jelly.at + (idx > jelly.at ? 1 : -1);
      }
      let px, py, pz, sy;
      if (jelly.hopping) {
        jelly.t = Math.min(1, jelly.t + 0.022 * f);
        const a = platformPos[jelly.from], b = platformPos[jelly.to];
        const arc = Math.sin(jelly.t * Math.PI);
        px = THREE.MathUtils.lerp(a.x, b.x, jelly.t);
        pz = THREE.MathUtils.lerp(a.z, b.z, jelly.t);
        py = THREE.MathUtils.lerp(a.y, b.y, jelly.t) + arc * 3.4 + 1.12 * JS;
        sy = 1 + arc * 0.35;                       // 공중에서 길쭉~
        feet.forEach((f, fi) => { f.position.y = -0.72 - arc * 0.22 + Math.sin(jelly.t * 16 + fi * 3) * 0.05; }); // 발 파닥파닥
        if (jelly.t >= 1) { jelly.hopping = false; jelly.at = jelly.to; jelly.squash = 1; }
      } else {
        const here = platformPos[jelly.at];
        const bounce = Math.abs(Math.sin(t * 3.1));
        px = here.x; pz = here.z;
        py = here.y + 1.12 * JS + bounce * 0.3;
        sy = 0.94 + bounce * 0.14;                 // 제자리 콩콩
        if (jelly.squash > 0) {                    // 착지 순간 찌부~
          sy = 1 - jelly.squash * 0.4;
          py = here.y + 1.0 * JS;
          jelly.squash = Math.max(0, jelly.squash - 0.055 * f);
        }
        feet.forEach((f, fi) => { f.position.y = -0.72 + bounce * 0.04 * (fi ? 1 : -1); });
      }
      player.position.set(px, py, pz);
      player.scale.set(JS / Math.sqrt(sy), JS * sy, JS / Math.sqrt(sy)); // 스쿼시 & 스트레치 (부피 보존, 150% 크기)
      glow.position.set(px, py + 1.5, pz);

      // 플랫폼 색: 결과 반영 (금색=정답, 적색=오답, 현재=펄스)
      const results = resultsRef.current;
      platforms.forEach((m, i) => {
        if (results[i] === true) { m.material.color.setHex(0xd9a531); m.material.emissive.setHex(0x6b4d0a); m.userData.ring.material.color.setHex(0xffcf5c); }
        else if (results[i] === false) { m.material.color.setHex(0xb23a4e); m.material.emissive.setHex(0x511320); m.userData.ring.material.color.setHex(0xff7488); }
        else if (i === idx) {
          const pulse = 0.5 + Math.sin(t * 1.4) * 0.5; // 두근두근 속도 추가 감속(50%)
          m.material.emissive.setRGB(0.08 + pulse * 0.1, 0.25 + pulse * 0.3, 0.4 + pulse * 0.4);
          m.material.color.setHex(0x1f4f8f);
        } else { m.material.color.setHex(0x1c2b57); m.material.emissive.setHex(0x0a1330); }
        m.userData.ring.rotation.z = t * (i % 2 ? 0.4 : -0.4);
      });

      camTarget.set(base.x + Math.sin(t * 0.18) * 1.2, base.y + 5.5, base.z + 11.5);
      camera.position.lerp(camTarget, Math.min(1, 0.045 * f));
      camera.lookAt(player.position.x, player.position.y + 0.4, player.position.z - 3);
      renderer.render(scene, camera);
    };
    animate();

    const onResize = () => {
      camera.aspect = mount.clientWidth / mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    };
    window.addEventListener("resize", onResize);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
      renderer.dispose();
      mount.removeChild(renderer.domElement);
    };
  }, [version, resultsRef]);

  return <div ref={mountRef} style={{ position: "absolute", inset: 0 }} />;
}

/* ---------- 메인 앱 ---------- */
function AiPotQuest() {
  const [version, setVersion] = useState(0);            // 재시작 시 세션 재생성
  const session = useMemo(() => buildSession(), [version]);
  const [phase, setPhase] = useState("intro");           // intro | quiz | done
  const [idx, setIdx] = useState(0);                     // 현재 화면에 표시 중인 문제 (0-based)
  const [selected, setSelected] = useState(null);        // 아직 제출 전인 임시 선택/입력값
  const [answers, setAnswers] = useState(() => Array(TOTAL).fill(null)); // 스테이지 인덱스에 고정된 풀이 기록
  const [panelOpen, setPanelOpen] = useState(false);
  const resultsRef = useRef(Array(TOTAL).fill(null));    // 3D 플랫폼 색상용
  const panelBodyRef = useRef(null);
  const itemRefs = useRef({});                           // 해설 패널의 스테이지별 DOM 참조 (자동 스크롤용)
  const hudRef = useRef(null);
  const footRef = useRef(null);
  const [safeTop, setSafeTop] = useState(64);            // 상단바 실제 높이 (모바일 2줄 대응)
  const [safeBottom, setSafeBottom] = useState(58);      // 하단 크레딧 푸터 높이

  // 상단바·푸터 높이를 측정해 문제칸이 겹치지 않도록 안전 영역 계산
  useEffect(() => {
    const update = () => {
      if (hudRef.current) setSafeTop(hudRef.current.offsetHeight);
      if (footRef.current) setSafeBottom(footRef.current.offsetHeight);
    };
    update();
    window.addEventListener("resize", update);
    const tid = setTimeout(update, 400); // 폰트 로드 후 재측정
    return () => { window.removeEventListener("resize", update); clearTimeout(tid); };
  }, [phase, panelOpen, answers]);

  const q = session[idx];
  const rec = answers[idx];              // 이 문제의 풀이 기록 (있으면 이미 답변 완료 → 복습 모드)
  const answered = !!rec;
  const answeredCount = answers.filter(Boolean).length;
  const sel = answered ? rec.sel : selected; // 화면 하이라이트용 선택값
  const score = answers.filter(a => a && a.correct).length;

  useEffect(() => {
    // 폰트 로드
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap";
    document.head.appendChild(link);
    return () => { document.head.removeChild(link); };
  }, []);

  useEffect(() => {
    // 해설 패널: 패널이 열려 있거나 문제를 이동할 때 현재 스테이지 카드로 자동 스크롤
    if (panelOpen && itemRefs.current[idx]) {
      itemRefs.current[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }, [idx, panelOpen]);

  const answer = useCallback((ans) => {
    if (phase !== "quiz" || answers[idx]) return; // 이미 푼 문제는 답안 수정 불가
    const isCorrect = q.type === "ox" ? ans === q.answer
      : q.type === "fill" ? ans === q.answer
      : q.type === "short" ? q.accepted.includes(norm(ans))
      : ans === q.correctIndex;
    const answerText = q.type === "ox" ? (q.answer ? "O (맞다)" : "X (아니다)")
      : q.type === "fill" ? `${q.answer}번 (${q.options[q.answer - 1]})`
      : q.type === "short" ? q.answerDisplay
      : q.answerText;
    const userAnsText = q.type === "ox" ? (ans ? "O (맞다)" : "X (아니다)")
      : q.type === "fill" ? `${ans}번 (${q.options[ans - 1]})`
      : q.type === "short" ? String(ans)
      : q.choices[ans];
    setSelected(ans);
    resultsRef.current[idx] = isCorrect;
    setAnswers(prev => {
      const next = [...prev];
      next[idx] = { stage: idx + 1, q: q.q, type: q.type, correct: isCorrect, userAns: userAnsText, answerText, explain: q.explain, sel: ans, mock: q.mock || false };
      return next;
    });
  }, [phase, q, idx, answers]);

  // 문제 이동 — 풀었든 안 풀었든 전체 40문제를 자유롭게 오갈 수 있습니다
  const goTo = (i) => {
    if (i < 0 || i >= TOTAL) return;
    setIdx(i);
    setSelected(null);
    setPhase("quiz");
  };

  const next = () => {
    if (idx + 1 >= TOTAL) { setPhase("done"); return; }
    goTo(idx + 1);
  };

  const restart = () => {
    resultsRef.current = Array(TOTAL).fill(null);
    setVersion(v => v + 1);
    setAnswers(Array(TOTAL).fill(null));
    setIdx(0);
    setSelected(null);
    setPhase("intro");
  };

  /* ---------- 스타일 토큰 ---------- */
  const C = {
    bg: "#070B1E", panel: "rgba(15,22,49,0.88)", line: "rgba(90,120,220,0.35)",
    cyan: "#35E0FF", gold: "#FFCF5C", red: "#FF7488", text: "#E9EEFF", dim: "#9AA8D8",
  };
  const S = {
    root: { position: "fixed", inset: 0, background: `radial-gradient(1200px 700px at 50% -10%, #14224e 0%, ${C.bg} 55%)`, color: C.text, fontFamily: "'IBM Plex Sans KR','Spoqa Han Sans','Apple SD Gothic Neo',sans-serif", overflow: "hidden" },
    display: { fontFamily: "'Jua','Spoqa Han Sans','IBM Plex Sans KR',sans-serif", fontWeight: 700 },
    hud: { position: "absolute", top: 0, left: 0, right: 0, display: "flex", alignItems: "center", flexWrap: "wrap", columnGap: 14, rowGap: 10, padding: "14px 18px", zIndex: 5, pointerEvents: "none" },
    chip: { background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "6px 12px", fontSize: 13, backdropFilter: "blur(6px)" },
    card: { width: "min(620px, 100%)", maxHeight: "100%", overflowY: "auto", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 18, padding: "26px 26px 22px", backdropFilter: "blur(10px)", boxShadow: "0 20px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(53,224,255,0.08) inset", pointerEvents: "auto" },
    // 상단바 아래 ~ 하단 크레딧 위 영역에서 수직 가운데 정렬 (겹침 방지)
    cardWrap: { position: "absolute", left: 0, right: 0, top: safeTop + 4, bottom: safeBottom + 4, display: "flex", alignItems: "center", justifyContent: "center", padding: "6px 16px", zIndex: 6, pointerEvents: "none" },
    btn: { cursor: "pointer", border: `1px solid ${C.line}`, background: "rgba(28,43,87,0.7)", color: C.text, borderRadius: 12, padding: "13px 16px", fontSize: 15, textAlign: "left", width: "100%", fontFamily: "inherit", transition: "transform .12s, border-color .12s, background .12s" },
    primary: { cursor: "pointer", border: "none", background: `linear-gradient(135deg, ${C.cyan}, #4a7dff)`, color: "#04101f", fontWeight: 700, borderRadius: 12, padding: "13px 22px", fontSize: 16, fontFamily: "'Jua','Spoqa Han Sans',sans-serif", letterSpacing: 0.5 },
    nav: (dis) => ({ cursor: dis ? "default" : "pointer", opacity: dis ? 0.35 : 1, background: "rgba(28,43,87,0.7)", border: `1px solid ${C.line}`, color: C.text, borderRadius: 8, padding: "5px 11px", fontSize: 12, fontFamily: "inherit", whiteSpace: "nowrap" }),
  };

  return (
    <div style={S.root}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap');
        /* 모바일 폴백: 아티팩트에서 항상 허용되는 cdnjs에서 직접 로드 */
        @font-face {
          font-family: 'Spoqa Han Sans';
          font-style: normal;
          font-weight: 400;
          font-display: swap;
          src: url('https://cdnjs.cloudflare.com/ajax/libs/spoqa-han-sans/neo/Subset/SpoqaHanSans/SpoqaHanSansRegular.woff2') format('woff2'),
               url('https://cdnjs.cloudflare.com/ajax/libs/spoqa-han-sans/neo/Subset/SpoqaHanSans/SpoqaHanSansRegular.woff') format('woff');
        }
        @font-face {
          font-family: 'Spoqa Han Sans';
          font-style: normal;
          font-weight: 700;
          font-display: swap;
          src: url('https://cdnjs.cloudflare.com/ajax/libs/spoqa-han-sans/neo/Subset/SpoqaHanSans/SpoqaHanSansBold.woff2') format('woff2'),
               url('https://cdnjs.cloudflare.com/ajax/libs/spoqa-han-sans/neo/Subset/SpoqaHanSans/SpoqaHanSansBold.woff') format('woff');
        }
        @keyframes hintPulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(255,207,92,0.55); border-color: rgba(255,207,92,0.9); }
          50%      { box-shadow: 0 0 14px 5px rgba(255,207,92,0.15); border-color: rgba(53,224,255,0.9); }
        }
        @media (prefers-reduced-motion: reduce) {
          .hint-pulse { animation: none !important; }
        }
        @media (max-width: 640px) {
          .quiz-card { padding: 13px 13px 11px !important; }
        }
      `}</style>
      <StageWorld stageIndex={idx} resultsRef={resultsRef} version={version} />

      {/* HUD */}
      <div ref={hudRef} style={S.hud}>
        <div style={{ ...S.chip, ...S.display, fontSize: 16, color: C.cyan, letterSpacing: 1 }}>AI-POT 2급 QUEST</div>
        {phase !== "intro" && (
          <>
            <div style={S.chip}>STAGE <b style={{ color: C.gold }}>{Math.min(idx + 1, TOTAL)}</b> / {TOTAL}</div>
            <div style={S.chip}>SCORE <b style={{ color: C.cyan }}>{score}</b></div>
            <div style={{ flex: 1, maxWidth: 260, height: 8, background: "rgba(255,255,255,0.08)", borderRadius: 99, overflow: "hidden" }}>
              <div style={{ width: `${(answeredCount / TOTAL) * 100}%`, height: "100%", background: `linear-gradient(90deg, ${C.cyan}, ${C.gold})`, transition: "width .4s" }} />
            </div>
          </>
        )}
        <div style={{ marginLeft: "auto", pointerEvents: "auto" }}>
          <button
            onClick={() => setPanelOpen(o => !o)}
            className={phase === "intro" && !panelOpen ? "hint-pulse" : undefined}
            style={{
              ...S.chip, cursor: "pointer", color: C.text, fontFamily: "inherit",
              ...(phase === "intro" && !panelOpen
                ? { animation: "hintPulse 4.6s ease-in-out infinite", border: `1px solid ${C.gold}` }
                : {}),
            }}>
            📋 문제 해설 {panelOpen ? "닫기" : `열기 (${answeredCount}/${TOTAL})`}
          </button>
        </div>
      </div>

      {/* ---------- 인트로 ---------- */}
      {phase === "intro" && (
        <div style={S.cardWrap}>
        <div style={{ ...S.card, textAlign: "center" }}>
          <div style={{ ...S.display, fontSize: 40, lineHeight: 1.2, background: `linear-gradient(90deg, ${C.cyan}, ${C.gold})`, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
            AI-POT 2급 QUEST
          </div>
          <p style={{ color: C.dim, margin: "10px 0 4px", fontSize: 15 }}>AI프롬프트활용능력 2급 · 3D 스테이지 모의고사</p>
          <div style={{ textAlign: "left", margin: "18px auto", maxWidth: 460, fontSize: 14, lineHeight: 1.6, color: C.text, background: "rgba(0,0,0,0.25)", borderRadius: 12, padding: "14px 18px", border: `1px solid ${C.line}` }}>
            <div style={{ marginBottom: 10 }}>🎮 총 <b style={{ color: C.gold }}>40개 스테이지</b> — 문제 1개 = 스테이지 1개</div>
            <div style={{ marginBottom: 10 }}>🎲 문제은행 <b style={{ color: C.cyan }}>{QUESTION_BANK.length}문항</b> 중 매 회차 랜덤 출제 (이어하기 없음)</div>
            <div style={{ marginBottom: 10 }}>⭕ OX·객관식(1~30) + 단답형 주관식(31~35) + 지시문 주관식(36~40)</div>
            <div style={{ marginBottom: 10 }}>🏆 정답이면 금색, 오답이면 붉은 스테이지로 표시</div>
            <div style={{ marginBottom: 10 }}>◀▶ 이전/다음 버튼과 해설 패널로 40문제를 어떤 순서로든 자유롭게 이동할 수 있어요 (푼 문제는 수정 불가)</div>
            <div>📋 우측 <b>문제 해설</b> 패널에 풀이 기록과 해설이 쌓입니다</div>
          </div>
          <button style={S.primary} onClick={() => setPhase("quiz")}>게임 시작 ▶</button>
        </div>
        </div>
      )}

      {/* ---------- 문제 카드 ---------- */}
      {phase === "quiz" && q && (
        <div style={S.cardWrap}>
        <div style={S.card} className="quiz-card">
          {/* 헤더 + 이전/다음 내비게이션 */}
          <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
            <span style={{ ...S.display, color: C.gold, fontSize: 18 }}>STAGE {idx + 1}</span>
            <span style={{ fontSize: 12, color: C.dim, border: `1px solid ${C.line}`, borderRadius: 99, padding: "2px 10px" }}>
              {q.type === "ox" ? "OX 퀴즈" : q.type === "fill" ? "지시문 주관식" : q.type === "short" ? "단답형 주관식" : "객관식"}
            </span>
            {q.mock && (
              <span style={{ fontSize: 11, color: "#C9A8FF", border: "1px solid rgba(201,168,255,0.5)", background: "rgba(201,168,255,0.1)", borderRadius: 99, padding: "1px 8px" }}>예상문제</span>
            )}
            <span style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
              <button onClick={() => goTo(idx - 1)} disabled={idx === 0} style={S.nav(idx === 0)}>◀ 이전</button>
              <button onClick={() => goTo(idx + 1)} disabled={idx + 1 >= TOTAL} style={S.nav(idx + 1 >= TOTAL)}>다음 ▶</button>
              <button onClick={() => setPhase("done")} style={S.nav(false)}>🏁 결과</button>
            </span>
          </div>
          {answered && (
            <div style={{ fontSize: 11.5, color: C.dim, marginBottom: 10 }}>🔒 이미 풀이를 완료한 문제입니다 — 답안 수정은 불가능합니다</div>
          )}

          {/* 지시문 주관식: 전체 지시문 상시 노출 (현재 빈칸 강조) */}
          {q.type === "fill" && (
            <div style={{ fontSize: 12.5, color: C.dim, lineHeight: 1.6, marginBottom: 8 }}>{q.setIntro}</div>
          )}
          {q.type === "fill" && (
            <div style={{ whiteSpace: "pre-wrap", fontSize: 13, lineHeight: 1.7, color: C.text, background: "rgba(0,0,0,0.3)", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 14, maxHeight: 220, overflowY: "auto" }}>
              {q.context.split(q.blank).map((part, i, arr) => i < arr.length - 1
                ? <React.Fragment key={i}>{part}<b style={{ color: "#04101f", background: C.gold, borderRadius: 4, padding: "0 4px" }}>{q.blank}</b></React.Fragment>
                : part)}
            </div>
          )}

          {/* 단답형 주관식: 제시문 */}
          {q.type === "short" && q.context && (
            <div style={{ whiteSpace: "pre-wrap", fontSize: 13, lineHeight: 1.7, color: C.text, background: "rgba(0,0,0,0.3)", border: `1px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 14 }}>
              {q.context}
            </div>
          )}

          <div style={{ fontSize: 17.5, lineHeight: 1.65, fontWeight: 600, marginBottom: 18 }}>{q.q}</div>

          {/* 보기 */}
          {q.type === "ox" ? (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
              {[true, false].map(v => {
                const chosen = sel === v;
                const isAns = answered && q.answer === v;
                const isWrongPick = answered && chosen && !isAns;
                return (
                  <button key={String(v)} disabled={answered} onClick={() => answer(v)}
                    style={{ ...S.btn, textAlign: "center", fontSize: 34, padding: "20px 0", fontFamily: "'Jua','Spoqa Han Sans',sans-serif", fontWeight: 700,
                      color: v ? "#7DF0FF" : "#FFB1BD",
                      borderColor: isAns ? C.gold : isWrongPick ? C.red : C.line,
                      background: isAns ? "rgba(255,207,92,0.18)" : isWrongPick ? "rgba(255,116,136,0.16)" : S.btn.background,
                      boxShadow: isAns ? `0 0 18px rgba(255,207,92,.35)` : "none" }}>
                    {v ? "O" : "X"}
                    <div style={{ fontSize: 13, color: C.dim, fontFamily: "'IBM Plex Sans KR','Spoqa Han Sans',sans-serif", marginTop: 4 }}>{v ? "맞다" : "아니다"}</div>
                  </button>
                );
              })}
            </div>
          ) : q.type === "fill" ? (
            <div>
              <div style={{ fontSize: 12, color: C.dim, marginBottom: 6 }}>&lt;보기&gt; — 번호를 눌러 선택한 뒤 제출하세요</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(104px, 1fr))", gap: 6, maxHeight: 190, overflowY: "auto", padding: "8px", background: "rgba(0,0,0,0.25)", border: `1px solid ${C.line}`, borderRadius: 12, marginBottom: 12 }}>
                {q.options.map((opt, i) => {
                  const n = i + 1;
                  const chosen = sel === n;
                  const isAns = answered && n === q.answer;
                  const isWrongPick = answered && chosen && !isAns;
                  return (
                    <button key={n} disabled={answered} onClick={() => setSelected(n)}
                      style={{ ...S.btn, padding: "7px 8px", fontSize: 12.5, borderRadius: 9,
                        borderColor: isAns ? C.gold : isWrongPick ? C.red : chosen ? C.cyan : C.line,
                        background: isAns ? "rgba(255,207,92,0.18)" : isWrongPick ? "rgba(255,116,136,0.16)" : chosen ? "rgba(53,224,255,0.14)" : S.btn.background,
                        boxShadow: isAns ? "0 0 14px rgba(255,207,92,.3)" : "none" }}>
                      <b style={{ color: isAns ? C.gold : isWrongPick ? C.red : C.cyan, marginRight: 5 }}>{n}</b>{opt}
                    </button>
                  );
                })}
              </div>
              {!answered && (
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ flex: 1, fontSize: 13, color: selected ? C.cyan : C.dim }}>
                    {selected ? `선택한 답안: ${selected}번 (${q.options[selected - 1]})` : "아직 선택하지 않았습니다"}
                  </div>
                  <button style={{ ...S.primary, opacity: selected ? 1 : 0.4, cursor: selected ? "pointer" : "not-allowed" }}
                    disabled={!selected} onClick={() => answer(selected)}>답안 제출 ✔</button>
                </div>
              )}
            </div>
          ) : q.type === "short" ? (
            <div>
              <div style={{ fontSize: 12, color: C.dim, marginBottom: 6 }}>
                답안을 직접 입력하세요 — 띄어쓰기·대소문자·한/영 표기는 가리지 않고 채점합니다
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <input
                  value={answered ? String(rec.sel) : (selected ?? "")}
                  disabled={answered}
                  onChange={(e) => setSelected(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && selected && String(selected).trim()) answer(String(selected).trim()); }}
                  placeholder="답안 입력 (예: 프롬프트)"
                  style={{ flex: 1, minWidth: 160, background: "rgba(0,0,0,0.35)",
                    border: `1px solid ${answered ? (rec.correct ? C.gold : C.red) : C.line}`,
                    borderRadius: 10, padding: "12px 14px", fontSize: 15, color: C.text, fontFamily: "inherit", outline: "none" }}
                />
                {!answered && (
                  <button style={{ ...S.primary, opacity: selected && String(selected).trim() ? 1 : 0.4, cursor: selected && String(selected).trim() ? "pointer" : "not-allowed" }}
                    disabled={!selected || !String(selected).trim()} onClick={() => answer(String(selected).trim())}>답안 제출 ✔</button>
                )}
              </div>
            </div>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {q.choices.map((c, i) => {
                const chosen = sel === i;
                const isAns = answered && i === q.correctIndex;
                const isWrongPick = answered && chosen && !isAns;
                return (
                  <button key={i} disabled={answered} onClick={() => answer(i)}
                    style={{ ...S.btn,
                      borderColor: isAns ? C.gold : isWrongPick ? C.red : C.line,
                      background: isAns ? "rgba(255,207,92,0.18)" : isWrongPick ? "rgba(255,116,136,0.16)" : S.btn.background,
                      boxShadow: isAns ? `0 0 18px rgba(255,207,92,.3)` : "none" }}>
                    <b style={{ color: isAns ? C.gold : C.cyan, marginRight: 8 }}>{i + 1}</b> {c}
                    {isAns && <span style={{ float: "right", color: C.gold }}>✔ 정답</span>}
                    {isWrongPick && <span style={{ float: "right", color: C.red }}>✘ 내 선택</span>}
                  </button>
                );
              })}
            </div>
          )}

          {/* 결과 + 해설 */}
          {answered && (
            <div style={{ marginTop: 18 }}>
              <div style={{ ...S.display, fontSize: 24, color: rec.correct ? C.gold : C.red, textAlign: "center", marginBottom: 8 }}>
                {rec.correct ? "⭐ STAGE CLEAR! 정답입니다!" : "💥 오답입니다!"}
              </div>
              {!rec.correct && (
                <div style={{ textAlign: "center", fontSize: 14, color: C.text, marginBottom: 8 }}>
                  {q.type === "short" && <span style={{ color: C.red, marginRight: 10 }}>내 답: {rec.userAns}</span>}
                  정답: <b style={{ color: C.gold }}>{rec.answerText}</b>
                </div>
              )}
              <div style={{ background: "rgba(0,0,0,0.28)", border: `1px solid ${rec.correct ? "rgba(255,207,92,.4)" : "rgba(255,116,136,.4)"}`, borderRadius: 12, padding: "14px 16px", fontSize: 14, lineHeight: 1.75 }}>
                <b style={{ color: C.cyan }}>📖 해설</b><br />{q.explain}
              </div>
              <div style={{ textAlign: "center", marginTop: 16 }}>
                {idx + 1 >= TOTAL && answeredCount < TOTAL ? (
                  <>
                    <div style={{ fontSize: 13, color: C.gold, marginBottom: 10 }}>
                      ⚠ 아직 풀지 않은 문제가 {TOTAL - answeredCount}개 있습니다.
                    </div>
                    <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                      <button style={S.nav(false)} onClick={() => { const first = answers.findIndex(a => !a); if (first !== -1) goTo(first); }}>
                        ▶ 안 푼 문제부터 이어 풀기
                      </button>
                      <button style={S.primary} onClick={() => setPhase("done")}>결과 보기 🏁</button>
                    </div>
                  </>
                ) : (
                  <button style={S.primary} onClick={idx + 1 >= TOTAL ? () => setPhase("done") : next}>
                    {idx + 1 >= TOTAL ? "결과 보기 🏁" : "다음 문제 ▶"}
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
        </div>
      )}

      {/* ---------- 최종 결과 ---------- */}
      {phase === "done" && (
        <div style={S.cardWrap}>
        <div style={{ ...S.card, textAlign: "center" }}>
          <div style={{ ...S.display, fontSize: 36, color: C.gold }}>
            {answeredCount >= TOTAL ? "🏁 ALL STAGE COMPLETE" : "📊 현재까지의 결과"}
          </div>
          <div style={{ fontSize: 52, ...S.display, margin: "12px 0 2px", color: score >= 24 ? C.cyan : C.red }}>
            {score} <span style={{ fontSize: 22, color: C.dim }}>/ {TOTAL}</span>
          </div>
          <div style={{ color: C.dim, marginBottom: 6 }}>{Math.round((score / TOTAL) * 100)}점</div>
          {answeredCount < TOTAL ? (
            <div style={{ fontSize: 14, color: C.gold, marginBottom: 18 }}>
              ⚠ 아직 풀지 않은 문제가 {TOTAL - answeredCount}개 있습니다. 미응시 문제는 오답으로 계산되지 않고 점수에서 제외됩니다.
            </div>
          ) : (
            <div style={{ fontSize: 15, marginBottom: 18 }}>
              {score >= 32 ? "🌟 훌륭합니다! 합격 안정권 실력이에요." : score >= 24 ? "✅ 합격 기준(60점)을 넘었습니다. 오답 해설을 복습해 보세요!" : "📚 아직 부족해요. 우측 문제 해설에서 틀린 문제를 꼭 복습하세요!"}
            </div>
          )}
          <div style={{ fontSize: 13, color: C.dim, marginBottom: 18 }}>
            우측 '문제 해설' 패널에서 전체 40문제의 정답·오답과 해설을 확인하고, 클릭해서 원하는 문제로 이동할 수 있습니다.<br />
            (이어하기가 없으므로 다시 도전하면 새로운 순서로 출제됩니다)
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
            {answeredCount < TOTAL && (
              <button style={S.nav(false)} onClick={() => { const first = answers.findIndex(a => !a); if (first !== -1) goTo(first); }}>
                ▶ 안 푼 문제부터 이어 풀기
              </button>
            )}
            <button style={S.primary} onClick={restart}>🎲 새 모의고사 도전</button>
          </div>
        </div>
        </div>
      )}

      {/* ---------- 하단 상시 크레딧 · 출처 ---------- */}
      <div ref={footRef} style={{
        position: "absolute", left: 0, right: 0, bottom: 0, zIndex: 5, pointerEvents: "none",
        textAlign: "center", padding: "8px 14px 9px", fontSize: 10.5, lineHeight: 1.6, color: C.dim,
        background: "linear-gradient(transparent, rgba(7,11,30,0.9))",
      }}>
        {CREDIT.maker}<br />
        {CREDIT.powered}<br />
        {CREDIT.source}
      </div>

      {/* ---------- 우측 서브 메뉴: 문제 해설 ---------- */}
      <div style={{
        position: "absolute", top: safeTop + 4, right: panelOpen ? 14 : -360, bottom: safeBottom + 4, width: 330,
        background: C.panel, border: `1px solid ${C.line}`, borderRadius: 16, zIndex: 7,
        display: "flex", flexDirection: "column", transition: "right .35s ease", backdropFilter: "blur(10px)",
        boxShadow: "0 16px 50px rgba(0,0,0,0.5)"
      }}>
        <div style={{ padding: "14px 16px 10px", borderBottom: `1px solid ${C.line}`, display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ ...S.display, fontSize: 18, color: C.cyan }}>📋 문제 해설</span>
          <span style={{ fontSize: 12, color: C.dim, marginLeft: "auto" }}>
            <span style={{ color: C.gold }}>정답 {answers.filter(a => a && a.correct).length}</span> · <span style={{ color: C.red }}>오답 {answers.filter(a => a && !a.correct).length}</span> · <span>미응시 {TOTAL - answeredCount}</span>
          </span>
        </div>
        <div ref={panelBodyRef} style={{ flex: 1, overflowY: "auto", padding: "12px 12px 16px", display: "flex", flexDirection: "column", gap: 10 }}>
          {Array.from({ length: TOTAL }, (_, i) => {
            const h = answers[i];
            const isCurrent = phase === "quiz" && idx === i;
            if (h) {
              return (
                <div key={i} ref={(el) => { itemRefs.current[i] = el; }} onClick={() => goTo(i)} title="클릭하면 이 문제로 이동합니다 (답안 수정 불가)"
                  style={{
                  cursor: "pointer",
                  border: `1px solid ${isCurrent ? C.cyan : h.correct ? "rgba(255,207,92,.45)" : "rgba(255,116,136,.5)"}`,
                  background: h.correct ? "rgba(255,207,92,.07)" : "rgba(255,116,136,.08)",
                  borderRadius: 12, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.65,
                  boxShadow: isCurrent ? `0 0 10px rgba(53,224,255,.35)` : "none"
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                    <b style={{ color: h.correct ? C.gold : C.red, fontFamily: "'Jua','Spoqa Han Sans',sans-serif", fontSize: 14 }}>
                      {h.correct ? "⭕ 정답" : "❌ 오답"}
                    </b>
                    <span style={{ color: C.dim }}>STAGE {h.stage} · {h.type === "ox" ? "OX" : h.type === "fill" ? "지시문" : h.type === "short" ? "단답형" : "객관식"}</span>
                    {h.mock && <span style={{ fontSize: 10.5, color: "#C9A8FF" }}>예상문제</span>}
                    <span style={{ marginLeft: "auto", color: C.dim, fontSize: 11 }}>↩ 다시 보기</span>
                  </div>
                  <div style={{ fontWeight: 600, marginBottom: 5 }}>{h.q}</div>
                  {!h.correct && <div style={{ color: C.red, marginBottom: 2 }}>내 답: {h.userAns}</div>}
                  <div style={{ color: C.gold, marginBottom: 5 }}>정답: {h.answerText}</div>
                  <div style={{ color: "#C7D2F5", borderTop: "1px dashed rgba(255,255,255,.15)", paddingTop: 5 }}>
                    💡 {h.explain}
                  </div>
                </div>
              );
            }
            return (
              <div key={i} ref={(el) => { itemRefs.current[i] = el; }} onClick={() => goTo(i)} title="클릭하면 이 문제로 이동합니다"
                style={{
                cursor: "pointer",
                border: `1px dashed ${isCurrent ? C.cyan : C.line}`,
                opacity: isCurrent ? 1 : 0.55,
                borderRadius: 12, padding: "10px 12px", fontSize: 12.5, lineHeight: 1.6,
                boxShadow: isCurrent ? `0 0 10px rgba(53,224,255,.3)` : "none"
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <b style={{ color: C.dim, fontFamily: "'Jua','Spoqa Han Sans',sans-serif", fontSize: 14 }}>STAGE {i + 1}</b>
                  <span style={{ marginLeft: "auto", color: C.dim, fontSize: 11 }}>👉 풀러 가기</span>
                </div>
                <div style={{ color: C.dim, marginTop: 2 }}>🔲 아직 풀지 않은 문제입니다</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AiPotQuest />);

document.getElementById("loading").style.display = "none";
  </script>
</body>
</html>
